limit_req_zone $binary_remote_addr zone=api_r:10m rate=30r/m;

upstream geoakim_web {
    server web:80;
}

server {
    listen 80;
    server_name _;

    location = /api/r {
        limit_req zone=api_r burst=10 nodelay;
        proxy_pass http://geoakim_web;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    location / {
        proxy_pass http://geoakim_web;
        include /etc/nginx/snippets/proxy_params.conf;
    }
}

# TLS: place fullchain.pem + privkey.pem in nginx/certs/ and include geoakim-ssl.conf
# See nginx/conf.d/geoakim-ssl.conf.example
