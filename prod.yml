name: geoakim-prod

services:
  nginx:
    image: nginx:alpine
    container_name: geoakim-prod-nginx
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - geoakim-network

  web:
    build: .
    container_name: geoakim-prod-web
    restart: always
    expose:
      - "80"
    volumes:
      - ./logs:/var/www/app/logs
    environment:
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_DATABASE=${MONGO_DATABASE}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_TIMEZONE=${APP_TIMEZONE}
      - SESSION_SECRET=${SESSION_SECRET}
      - AD_MP_URL=${AD_MP_URL}
      - AD_MP_DOMAIN=${AD_MP_DOMAIN}
      - AD_MP_BASE_DN=${AD_MP_BASE_DN}
      - AD_MP_USE_SSL=${AD_MP_USE_SSL:-false}
      - MEETING_URL_ALLOWLIST=${MEETING_URL_ALLOWLIST:-teams.microsoft.com}
      - COLLECT_RATE_LIMIT=${COLLECT_RATE_LIMIT:-30}
    command: bash -c "chmod -R 777 /var/www/app/logs 2>/dev/null; /usr/local/bin/docker-entrypoint.sh"
    depends_on:
      - mongodb
    networks:
      - geoakim-network

  mongodb:
    image: mongo:7.0
    container_name: geoakim-prod-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - /dados/geoakin/mongodb:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - geoakim-network

networks:
  geoakim-network:
    driver: bridge
